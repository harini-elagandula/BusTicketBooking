
<!DOCTYPE html>
<html>
<head>
    <title>Bus Ticket Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Bus Ticket Booking System</h1>
        <p>Book Your Bus Tickets Online</p>

        <form id="bookingForm">

            <label>Passenger Name:</label>
            <input type="text" id="name"
                   placeholder="Enter name" required>

            <label>Source:</label>
            <input type="text" id="source"
                   placeholder="Enter source" required>

            <label>Destination:</label>
            <input type="text" id="destination"
                   placeholder="Enter destination" required>

            <label>Journey Date:</label>
            <input type="date" id="date" required>

            <label>Number of Seats:</label>
            <input type="number" id="seats"
                   min="1" placeholder="Enter seats" required>

            <p class="price">Ticket Price: ₹300 per seat</p>

            <button type="submit">Book Ticket</button>

        </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
